name: Elasticsearch (Not Ready)
slug: elasticsearch
description: >-
  This Elasticsearch MCP Server connects agents to your Elasticsearch data. It allows you to interact with your Elasticsearch indices through natural language conversations.
setupDescription: |-
  - If you experience **certificate-related issues**, please ensure that the certificate for the Elasticsearch server is added to your system's trusted certificate store.
logo: /elasticsearch-logo.png
config:
  type: stdio
  command: npx
  args:
    - -y
    - \@elastic/mcp-server-elasticsearch
  env:
    ES_URL: https://eap-kb-sit
    ES_USERNAME: ${input:elasticsearch_username}
    ES_PASSWORD: ${input:elasticsearch_password}
tags:
  - production
tools:
  - name: list_indices
    description: List all available Elasticsearch indices
  - name: get_mappings
    description: Get field mappings for a specific Elasticsearch index
  - name: search
    description: Perform an Elasticsearch search with the provided query DSL
  - name: get_shards
    description: get_shards
