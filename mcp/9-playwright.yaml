name: Playwright
slug: playwright
description: >-
  Provides browser automation via Playwright, allowing LLMs to interact with web pages using structured accessibility snapshots instead of screenshots.
setupDescription: |-
  The tools are available in two modes:

  1. **Snapshot Mode (default)**: Uses accessibility snapshots for better performance and reliability
  2. **Vision Mode**: Uses screenshots for visual-based interactions

  To use Vision Mode, add the `--vision` flag when starting the server:
  ```json
  {
    "mcpServers": {
      "playwright": {
        "command": "npx",
        "args": [
          "@playwright/mcp@latest",
          "--vision"
        ]
      }
    }
  }
  ```

  Vision Mode works best with the computer use models that are able to interact with elements using X Y coordinate space, based on the provided screenshot.
logo: /playwright-logo.png
config:
  type: stdio
  command: npx
  args:
    - \@playwright/mcp@latest
tags:
  - development
  - qa
tools:
  - name: browser_snapshot
    description: Capture accessibility snapshot of the current page, this is better than screenshot
  - name: browser_click
    description: Perform click on a web page
  - name: browser_drag
    description: Perform drag and drop between two elements
  - name: browser_hover
    description: Hover over element on page
  - name: browser_type
    description: Type text into editable element
  - name: browser_select_option
    description: Select an option in a dropdown
  - name: browser_press_key
    description: Press a key on the keyboard
  - name: browser_wait_for
    description: Wait for text to appear or disappear or a specified time to pass
  - name: browser_file_upload
    description: Upload one or multiple files
  - name: browser_handle_dialog
    description: Handle a dialog
  - name: browser_navigate
    description: Navigate to a URL
  - name: browser_navigate_back
    description: Go back to the previous page
  - name: browser_navigate_forward
    description: Go forward to the next page
  - name: browser_take_screenshot
    description: Take a screenshot of the current page. You can't perform actions based on the screenshot, use browser_snapshot for actions.
  - name: browser_pdf_save
    description: Save page as PDF
  - name: browser_network_requests
    description: Returns all network requests since loading the page
  - name: browser_console_messages
    description: Returns all console messages
  - name: browser_install
    description: Install the browser specified in the config. Call this if you get an error about the browser not being installed.
  - name: browser_close
    description: Close the page
  - name: browser_resize
    description: Resize the browser window
  - name: browser_tab_list
    description: List browser tabs
  - name: browser_tab_new
    description: Open a new tab
  - name: browser_tab_select
    description: Select a tab by index
  - name: browser_tab_close
    description: Close a tab
  - name: browser_generate_playwright_test
    description: Generate a Playwright test for given scenario
  - name: browser_screen_capture
    description: Take a screenshot
  - name: browser_screen_move_mouse
    description: Move mouse to a given position
  - name: browser_screen_click
    description: Click left mouse button
  - name: browser_screen_drag
    description: Drag left mouse button
  - name: browser_screen_type
    description: Type text
  - name: browser_press_key
    description: Press a key on the keyboard
  - name: browser_wait_for
    description: Wait for text to appear or disappear or a specified time to pass
  - name: browser_file_upload
    description: Upload one or multiple files
  - name: browser_handle_dialog
    description: Handle a dialog
